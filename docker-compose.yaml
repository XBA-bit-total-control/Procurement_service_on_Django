services:
  postgres:
    image: postgres:14.3-alpine3.15
    ports:
      - "5432:5432"

    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_DB: "data_base"

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d data_base"]
      interval: 30s
      timeout: 20s
      retries: 5

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7.4.7
    ports:
      - '6379:6379'

    volumes:
      - redis_data:/data

  service_compraretis:
    build: .
    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

    command: >
      sh -c "python manage.py runserver 0.0.0.0:8000"

  celery:
    build:
      context: .
      dockerfile: Dockerfile.celery

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      service_compraretis:
        condition: service_started

    command: >
      sh -c "celery -A purchasing_service worker -l info"

volumes:
  postgres_data:
  redis_data: